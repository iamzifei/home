<script>
/* Resolve day/night before the first paint. Stored choice wins; with no
   stored choice the system decides, and keeps deciding — the listener is what
   makes "follow the system" mean the system as it is now, not as it was when
   the tab opened. */
(function () {
  var K = 'jamesai.press', r = document.documentElement, m;
  try { m = window.matchMedia('(prefers-color-scheme: dark)'); } catch (e) {}
  window.__pressSaved = function () {
    try { return localStorage.getItem(K) || 'system'; } catch (e) { return 'system'; }
  };
  /* Three states, and the third is the default: system, forced day, forced
     night. A two-way switch can force either side but can never get back to
     "whatever the system says", so the stored value is the choice — not the
     resulting colour — and the control cycles through all three.

     The plates are printed on stock and there are two stocks. Swapping the src
     rather than shipping both means only the run in use is ever fetched. */
  window.__pressApply = function (choice) {
    var night = choice === 'night' || (choice === 'system' && m && m.matches);
    r.setAttribute('data-press', night ? 'night' : 'day');
    var plates = document.querySelectorAll('img[data-day]');
    for (var i = 0; i < plates.length; i++) {
      var want = plates[i].getAttribute(night ? 'data-night' : 'data-day');
      if (plates[i].getAttribute('src') !== want) plates[i].setAttribute('src', want);
    }
  };
  __pressApply(__pressSaved());
  if (m && m.addEventListener) {
    m.addEventListener('change', function () {
      if (__pressSaved() === 'system') __pressApply('system');
    });
  }
})();
</script>
<style>
/* =====================================================================
   EDITION B — 报刊 / A ONE-PERSON PRESS
   ---------------------------------------------------------------------
   The second design, kept deliberately apart from the first. journey.html
   is a flight: a porthole, a departures board, a boarding pass. This is a
   printed sheet: a nameplate, a dateline, a contents page, columns, a
   colophon. Nothing here refers to the other one, and nothing here imports
   its stylesheet — two editions that share a token table are two editions
   welded together, and the point of having two is to be able to move one.

   WHY SERIF, WHEN THE DEFAULT SHOULD BE TO REFUSE IT
   "Creative brief, therefore serif" is the most reliable tell of a machine
   picking a typeface. It is used here for the two reasons that are allowed:
   the brief is LITERALLY books and newspapers, and edition A already sets
   its display type in a grotesk — if the two are not distinguishable at a
   glance then there is nothing to choose between.

   And it costs nothing: the stack is what macOS, iOS, Windows and the CJK
   systems already have. No web font is loaded, so the type arrives with the
   HTML rather than one round trip later.

   MONO-COLOR, RESOLVED ONCE
     substrate  substrate_pale_beige  #F5F1E8
     mode       controlled two-ink
     palette    palette_cobalt_terracotta
     inks       Cobalt #2148B8 (dominant) · Terracotta #C65F38 (accent)
     plates     cobalt = structure and image · terracotta = SIGNAL ONLY
     layout     composition_editorial_journal + composition_ruled_information
     type       type_literary (reading) + type_programmatic (labels, data)

   Terracotta appears in exactly four places on this page, and they are
   listed because a list is the only thing that keeps an accent ink honest:
   the dropped initial, the heavy rule under the nameplate, the issue number in
   the dateline, and the dot inside the printer's mark. A fifth would mean the
   discipline had quietly become decoration. (There were five; the chronology
   was the other one, and it has been cut.)
   ===================================================================== */

:root {
  color-scheme: light;

  /* paper */
  --p0: #F5F1E8;      /* the substrate */
  --p1: #EDE8DC;      /* one density down — plates, wells */
  --p2: #FAF8F2;      /* one density up — the raised sheet */

  /* the cobalt plate, by coverage. Every "grey" on this page is this one
     ink thinned over the paper; a warm neutral anywhere would be a third
     colour and the system rests on there not being one. */
  --ink:  #12255E;
  --ink2: #3D4C7B;
  --ink3: #616C8E;    /* the lightest that still clears 4.5:1 on the paper */
  --rule: #C6CBD9;
  --rule2:#DCDFE7;

  /* the terracotta plate: signal only */
  --sig:  #C65F38;
  --sig-t:#A94A26;    /* the same ink, denser, for text on paper */

  /* Latin first, then the CJK alias below, then the plain family names as a
     last resort. `ui-serif` sits AFTER the alias on purpose: a generic family
     is allowed to resolve to a system CJK face on its own, and if it does it
     wins before the alias is ever consulted. */
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua",
           Georgia, "PressSong", "Songti SC", "STSong", "Source Han Serif SC",
           "Noto Serif SC", ui-serif, serif;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue",
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

  --m: 8px;
  --page: min(100% - 2.5rem, 76rem);
  --gut: clamp(1.2rem, 2.4vw, 2.2rem);
  --measure: 34em;          /* the reading measure, in the reading face */
}

/* The dark state is not a theme. It is the same press run with the paper and
   the ink exchanged: two inks in, two inks out.

   THREE STATES, ONE BLOCK
   The default follows the system, and a reader who touches the switch gets
   their choice remembered from then on. That is three states — system, forced
   day, forced night — and the usual way to write it duplicates the whole token
   block, once under `prefers-color-scheme` and once under the attribute, where
   the two copies can silently drift apart.

   So the branch is resolved ONCE, in a five-line script in <head>, which sets
   `data-press` from storage or from the media query before anything paints.
   CSS then has a single night block and no duplicate to keep in step. The
   script is in the head rather than at the foot for the obvious reason: at the
   foot the page paints white first. */
:root[data-press="night"] {
  color-scheme: dark;
  --p0: #14161C;
  --p1: #1B1E27;
  --p2: #0F1116;
  --ink:  #ECE8DF;
  --ink2: #AEB6CC;
  --ink3: #8B93A8;
  --rule: #333849;
  --rule2:#262B39;
  --sig:  #E0784B;
  --sig-t:#E89468;
}

/* --- the mixed setting -------------------------------------------------
   Chosen by looking, not by taste. Six Latin serifs were set beside 宋体 at
   17px and compared side by side (docs/plans has the note):

     New York / Times   the Latin came out visibly smaller and lighter than the
                        ideographs around it — "Markdown" sank into the line
     Georgia            body matched well, but Georgia Bold is a weight darker
                        than 宋体 Bold, so every heading looked mismatched;
                        its old-style figures also drop the 3 in "W3C"
     Charter            good size match, a shade too dark
     Palatino           pleasant, Latin still slightly small
     Iowan Old Style →  cap height sits on the ideograph height, bold matches
                        宋体 bold, lining figures. This one.

   No web font is loaded for any of it. A CJK web font is 5–20 MB and there is
   no version of "fast" that includes one.

   THE ALIAS, AND WHY IT EXISTS
   Latin serifs do not carry 汉字, so CJK would fall through anyway — but they
   DO carry the em dash and the ellipsis, and in a Chinese line those must come
   from the Chinese face or 「——」 arrives as two thin Latin dashes at the wrong
   height. Scoping them to the CJK font by unicode-range is the fix. Curly
   quotes are deliberately NOT in the range: they are still wanted from the
   Latin face when they wrap an English phrase. */
@font-face {
  font-family: "PressSong";
  src: local("Songti SC"), local("STSong"), local("Source Han Serif SC"),
       local("Noto Serif SC"), local("SimSun");
  unicode-range: U+2014, U+2026, U+3000-303F, U+3400-4DBF, U+4E00-9FFF,
                 U+F900-FAFF, U+FE30-FE4F, U+FF00-FFEF;
  font-display: swap;
}
@font-face {
  font-family: "PressSong";
  font-weight: 600 900;
  src: local("Songti SC Bold"), local("STSong"), local("Songti SC"),
       local("Source Han Serif SC"), local("SimSun");
  unicode-range: U+2014, U+2026, U+3000-303F, U+3400-4DBF, U+4E00-9FFF,
                 U+F900-FAFF, U+FE30-FE4F, U+FF00-FFEF;
  font-display: swap;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  margin: 0;
  background: var(--p0);
  color: var(--ink);
  font-family: var(--serif);
  font-size: 17px;
  line-height: 1.8;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  font-kerning: normal;
}
h1, h2, h3, h4, p, dl, dd, figure, ul, ol { margin: 0; }
ul, ol { list-style: none; padding: 0; }
img { max-width: 100%; display: block; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--sig); outline-offset: 3px; }

.wrap { width: var(--page); margin-inline: auto; }

/* A label is data, not prose: it gets the programmatic face, tracked out and
   set small, and it never uses the reading face. */
.label {
  font-family: var(--mono); font-size: 0.6875rem; font-weight: 500;
  letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink3);
}

.skip {
  position: absolute; left: -9999px; top: 0;
  background: var(--p2); color: var(--ink); padding: 0.6rem 1rem; z-index: 50;
}
.skip:focus { left: 1rem; top: 1rem; }

/* --- the nameplate ---------------------------------------------------
   A newspaper's masthead is three things stacked: the name at a size
   nothing else on the page will ever reach, a rule heavy enough to be a
   horizon, and a line of facts nobody reads twice. All three, and nothing
   else — a nameplate carrying a navigation bar is a website wearing a
   newspaper's hat. */
.mast { padding-block: clamp(2.5rem, 7vw, 5rem) 0; }
.mast-kick { display: flex; justify-content: space-between; gap: 1rem;
             padding-bottom: 0.9rem; flex-wrap: wrap; }
.mast-name {
  font-family: var(--serif);
  font-size: clamp(3.2rem, 13vw, 8.5rem);
  line-height: 0.86;
  font-weight: 600;
  letter-spacing: -0.035em;
  margin: 0;
}
.mast-name em { font-style: italic; font-weight: 500; }
.mast-sub {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 1rem; flex-wrap: wrap; margin-top: 0.9rem;
}
.mast-cn { font-size: clamp(1rem, 2.4vw, 1.45rem); letter-spacing: 0.42em;
           color: var(--ink2); }
/* the horizon: one heavy terracotta bar and one hairline under it */
.mast-rule { margin-top: 1.1rem; border-top: 4px solid var(--sig); }
.mast-rule::after {
  content: ""; display: block; margin-top: 3px; border-top: 1px solid var(--ink);
}
.dateline {
  display: flex; flex-wrap: wrap; gap: 0.5rem 1.6rem;
  padding-block: 0.7rem; border-bottom: 1px solid var(--rule);
}
.dateline .no { color: var(--sig-t); }
.dateline > * { white-space: nowrap; }
/* The one control on the page, and it is set as quietly as the facts beside
   it: a printed sheet does not have buttons. */
.press-switch {
  font: inherit; letter-spacing: inherit; text-transform: none;
  background: none; border: 0; padding: 0; cursor: pointer; color: inherit;
}
.press-switch .js-mode-label { border-bottom: 1px solid var(--rule); }
.press-switch:hover { color: var(--ink); }
.press-switch:hover .js-mode-label { border-bottom-color: currentColor; }
/* The facts stay one flat run so the dateline's own gap still sits between
   them; the two controls are pushed to the end of the line together. */
.dl-facts { display: contents; }
/* THE CONTROLS.
   They were set as quietly as the facts beside them — 11px, the faintest ink,
   no icon, at the end of a line of five things that look exactly the same —
   and the result was a language switcher nobody could find. Quiet is right for
   a printed sheet; invisible is not a style, it is a missing control.

   Two changes: a glyph each, which is what says "this does something rather
   than states something", and one density more ink. Still 11px, still mono,
   still no button chrome. */
/* The controls sit inside rows of .label metadata (11px mono, uppercase,
   0.16em tracked). They must not BE that — a control dressed as metadata is
   a control nobody finds, which is the exact failure this block repairs. So:
   the same mono family, so they belong to the bar; one step larger and NOT
   uppercased, so they read as the two things on the line you can operate;
   and an icon each, which is what the eye actually scans for. Inheriting
   `font` alone gave 17px body serif — loud, and from the wrong system. */
.press-tools { margin-left: auto; display: inline-flex; align-items: center;
               gap: 1.1rem; color: var(--ink2);
               font-family: var(--mono); font-size: 0.75rem; font-weight: 500;
               letter-spacing: 0.02em; text-transform: none; }
.press-tools .ico { width: 12px; height: 12px; flex: none; fill: none;
                    stroke: currentColor; stroke-width: 1.2; }
.press-switch, .press-lang-wrap { display: inline-flex; align-items: center; gap: 0.45em; }
.press-lang-wrap { position: relative; }
.press-lang {
  font: inherit; letter-spacing: inherit; text-transform: none;
  background: none; border: 0; padding: 0 0.9em 0 0; color: inherit;
  border-bottom: 1px solid var(--rule); cursor: pointer;
  appearance: none; -webkit-appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%),
                    linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-size: 4px 4px, 4px 4px;
  background-position: right 3px center, right 0px center;
  background-repeat: no-repeat;
}
.press-lang:hover { color: var(--ink); }
.press-lang option { color: initial; }
/* Narrow screens: the DATELINE copy drops onto its own line, because the
   dateline is a wrapping row of facts and the controls should not be the
   ragged tail of it. The RUNNING HEAD copy must NOT do this — the running
   head is a fixed 40px bar, so a second line there is a clipped line. */
@media (max-width: 34rem) {
  .dateline .press-tools { margin-left: 0; width: 100%; }
  .runner .press-tools { gap: 0.75rem; }
}

/* --- the running head -------------------------------------------------
   NOT a navigation bar. The nameplate note above says a nameplate carrying a
   nav bar is a website wearing a newspaper's hat, and that still holds — but
   the measurement that prompted this says something else has to give: the
   page is 9450px, 7.1 screens, and the contents page stops being visible
   after 620px of it. For the other 93% the reader has no way to move and no
   idea where they are. Paper solves that with a RUNNING HEAD — the thin line
   a book prints at the top of every page with the part and the chapter — so
   that is what this is: part numeral, section, and the way back to the
   contents. Three items, one hairline, no logo, no menu.

   Fixed rather than sticky: sticky needs the element in flow, which would
   push the nameplate down by its height on a page whose first impression is
   the nameplate. */
.runner {
  position: fixed; inset: 0 0 auto 0; z-index: 40;
  display: flex; align-items: center; gap: 1rem;
  height: 2.5rem; padding-inline: max(calc((100% - var(--page)) / 2), 1.25rem);
  background: color-mix(in srgb, var(--p0) 92%, transparent);
  border-bottom: 1px solid var(--rule);
  opacity: 0; visibility: hidden;
  transition: opacity 220ms ease, visibility 220ms;
}
@supports (backdrop-filter: blur(2px)) {
  /* The only filter in the edition, on a strip that never moves relative to
     what is behind it — the cost that rule is normally about does not apply. */
  .runner { backdrop-filter: saturate(150%) blur(8px); }
}
.runner.on { opacity: 1; visibility: visible; }
@media (prefers-reduced-motion: reduce) { .runner { transition: none; } }
.runner a { text-decoration: none; }
.runner .brand { color: var(--ink); letter-spacing: 0.2em; }
.runner .here {
  flex: 1 1 auto; min-width: 0; text-align: center;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  /* The section name is the reason the strip exists, so it is a density up
     from the folio and the return link on either side of it. */
  color: var(--ink2);
}
.runner .here .f { color: var(--ink3); margin-right: 0.5em; }
.runner .press-tools { margin-left: auto; gap: 0.9rem; }
.runner .back { color: var(--ink3); border-bottom: 1px solid var(--rule); }
.runner .back:hover { color: var(--ink); }
/* Narrow: the strip drops the masthead name, then the section name, so the
   two controls and the way back to the contents always survive. They are the
   only things in it a reader can act on. */
@media (max-width: 46rem) { .runner .brand { display: none; } }
@media (max-width: 34rem) { .runner .here { display: none; } }
/* Anchors land below the strip rather than under it. */
.sec, .toc, #lead { scroll-margin-top: 3.2rem; }

/* --- the contents page ------------------------------------------------
   Set as a book's, not as a menu: a folio, a title, a leader, a count. The
   leader is a border on a flexed span rather than a row of dots, because
   dots wrap and a wrapped leader reads as a mistake. */
.toc { padding-block: clamp(1.6rem, 4vw, 2.6rem); }
.toc-grid { display: grid; gap: 0 var(--gut); grid-template-columns: 1fr; }
@media (min-width: 46rem) { .toc-grid { grid-template-columns: 1fr 1fr; } }
.toc a {
  display: flex; align-items: baseline; gap: 0.9rem;
  padding-block: 0.55rem; border-bottom: 1px solid var(--rule2);
  text-decoration: none;
}
.toc .folio { font-family: var(--mono); font-size: 0.75rem; color: var(--ink3);
              min-width: 2.2em; }
.toc .t { font-size: 1.0625rem; white-space: nowrap; }
.toc .lead-rule { flex: 1 1 auto; border-bottom: 1px dotted var(--rule);
                  transform: translateY(-0.28em); }
.toc .n { font-family: var(--mono); font-size: 0.75rem; color: var(--ink3); }
@media (hover: hover) { .toc a:hover .t { color: var(--sig-t); } }

/* --- section openers -------------------------------------------------- */
.sec { padding-block: clamp(2.6rem, 6vw, 4.5rem); }
.sec + .sec { border-top: 1px solid var(--rule); }
.sec-head {
  display: grid; grid-template-columns: auto 1fr; align-items: end;
  gap: 0 1rem; margin-bottom: clamp(1.4rem, 3vw, 2.2rem);
}
.sec-no {
  font-family: var(--serif); font-size: clamp(2.2rem, 6vw, 3.6rem);
  line-height: 0.8; font-weight: 600; letter-spacing: -0.03em;
  color: var(--rule);
}
.sec-t { font-size: clamp(1.3rem, 3vw, 1.9rem); font-weight: 600;
         letter-spacing: -0.015em; }
.sec-note { grid-column: 1 / -1; margin-top: 0.7rem; color: var(--ink2);
            max-width: var(--measure); font-size: 0.9375rem; }

/* --- 卷首 · the lead --------------------------------------------------
   Two columns and a dropped initial, which is the one place on the page
   where the design is allowed to be the point. The initial is terracotta:
   one of the four things that ink is permitted to do here. */
.lead { padding-block: clamp(2rem, 5vw, 3.4rem); }
.lead-body { font-size: 1.0625rem; line-height: 1.9; }
@media (min-width: 62rem) {
  .lead-body { column-count: 2; column-gap: clamp(2rem, 4vw, 3.2rem);
               column-rule: 1px solid var(--rule2); }
}
.lead-body p + p { margin-top: 1.1em; }
/* CJK takes a dropped initial as happily as Latin does; the glyph is square,
   so it needs less descent correction and a touch more optical space after. */
.lead-body > p:first-child::first-letter {
  float: left; font-family: var(--serif); font-weight: 600;
  font-size: 3.5em; line-height: 0.86;
  margin: 0.06em 0.1em 0 0; color: var(--sig-t);
}
.lead-by { margin-top: 1.6rem; padding-top: 0.8rem;
           border-top: 1px solid var(--rule2); display: flex;
           flex-wrap: wrap; gap: 0.4rem 1.4rem; }

/* --- plates -----------------------------------------------------------
   No captions. They said what the picture already showed — "卷首图", "实机演示"
   — and a caption that names the picture is a caption that is there because
   the slot existed.

   The space above and below is what a caption used to occupy and then some:
   in print a plate is given air on both sides, and a picture that starts one
   line under the paragraph reads as belonging to that paragraph rather than
   standing on its own. */
/* A BAND, not a full plate. Printed at their own proportions the two plates
   were 1460px of an 8365px page — 17% of the edition spent on two pictures
   that are atmosphere, not information. Cropped to 16:7 they still read, and
   the page gives back half a screen. */
.plate { margin-block: clamp(2.4rem, 5vw, 3.6rem); background: var(--p1);
         aspect-ratio: 16 / 7; overflow: hidden; }
.plate img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 42%; }

/* --- 特稿 · the feature ------------------------------------------------
   One opener, then entries. A magazine has one opener; four would be four
   magazines. The opener gets the full measure and its text set in columns;
   everything after it is an entry with the picture beside the prose. */
.feature .runhead { display: flex; justify-content: space-between; gap: 1rem;
                    padding-bottom: 0.6rem; border-bottom: 1px solid var(--ink);
                    flex-wrap: wrap; }
.feature h3 { font-size: clamp(2rem, 5.4vw, 3.2rem); line-height: 1.02;
              font-weight: 600; letter-spacing: -0.03em; margin-top: 0.8rem; }
.feature .standfirst { font-size: clamp(1.05rem, 2.2vw, 1.35rem);
                       font-style: italic; color: var(--ink2);
                       margin-top: 0.6rem; max-width: 30em; }
.feature .fig { margin-block: clamp(2rem, 4.5vw, 3.2rem) 0; }
/* The opener's paragraph is set larger and in TWO columns, never three.
   Three was measured at 1568px and gave columns of two lines each — a
   multi-column setting needs volume to be worth its rules, and this
   paragraph does not have it. Two reads as an opening; three read as a
   mistake. */
.feature .body { margin-top: clamp(2.4rem, 5vw, 3.6rem); font-size: 1.0625rem;
                 line-height: 1.85; }
@media (min-width: 52rem) {
  .feature .body { column-count: 2; column-gap: clamp(2rem, 4vw, 3rem);
                   column-rule: 1px solid var(--rule2); }
}

/* the picture frame. Every hero card and every demo is authored 16:10, so
   the frame is 16:10 and object-fit has nothing left to cut. */
.fig { position: relative; aspect-ratio: 16 / 10; overflow: hidden;
       background: var(--p1); display: block; }
.fig img, .fig video {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; max-width: none;
}
/* the frame is a link; the film must not eat the click or offer controls */
.fig video { pointer-events: none; }

/* --- entries ----------------------------------------------------------
   Picture and prose side by side, and the side ALTERNATES. In edition A the
   picture's left edge is column one every single time, on purpose. Here the
   opposite convention is right: a spread alternates, and four entries all
   turned the same way would read as a list rather than as pages. */
.entry { display: grid; gap: clamp(1.6rem, 4vw, 2.4rem); grid-template-columns: 1fr;
         padding-block: clamp(1.8rem, 4vw, 2.8rem);
         border-top: 1px solid var(--rule); }
@media (min-width: 52rem) {
  .entry { grid-template-columns: repeat(12, 1fr); align-items: start;
           column-gap: clamp(2rem, 4vw, 3.2rem); }
  .entry .e-fig { grid-column: 1 / span 7; }
  .entry .e-txt { grid-column: 8 / span 5; }
  .entry:nth-of-type(even) .e-fig { grid-column: 6 / span 7; grid-row: 1; }
  .entry:nth-of-type(even) .e-txt { grid-column: 1 / span 5; grid-row: 1; }
}
.entry h3 { font-size: clamp(1.4rem, 3vw, 1.9rem); line-height: 1.1;
            font-weight: 600; letter-spacing: -0.02em; }
.entry .standfirst { font-style: italic; color: var(--ink2); margin-top: 0.4rem; }
.entry p.desc { margin-top: 1.1rem; font-size: 0.9375rem; color: var(--ink2); }
.entry .runhead { margin-bottom: 0.5rem; }

/* --- the spec block ---------------------------------------------------
   A ruled fact list. The one place the page prints data rather than prose,
   so it is the one place set entirely in the programmatic face. */
/* A fact table is a different kind of object from the prose above it, and
   the gap has to say so — at 1.2rem the two read as one block. */
.spec { margin-top: clamp(1.6rem, 3vw, 2.4rem); border-top: 1px solid var(--rule); }
.spec div { display: flex; justify-content: space-between; gap: 1rem;
            padding-block: 0.42rem; border-bottom: 1px solid var(--rule2); }
/* On the opener the spec has the full measure to itself, and a label at the
   far left with its value 1100px away is not a pair, it is two things on the
   same line. Two up, so a row is a readable length. */
@media (min-width: 52rem) {
  .feature .spec { display: grid; grid-template-columns: 1fr 1fr;
                   column-gap: clamp(2rem, 4vw, 3rem); }
}
.spec dt { font-family: var(--mono); font-size: 0.6875rem; letter-spacing: 0.12em;
           text-transform: uppercase; color: var(--ink3); white-space: nowrap; }
.spec dd { font-family: var(--mono); font-size: 0.75rem; text-align: right;
           overflow-wrap: anywhere; }

/* --- 索引 · the classifieds -------------------------------------------
   The rest of the catalogue, set dense. This is where the page earns its
   density: three columns of ruled entries, each with its paragraph, which
   is a great deal of information in very little height — and it is set as
   a newspaper's small ads are set, because that is the form that solved
   this exact problem. */
.idx { display: grid; gap: 0 var(--gut); grid-template-columns: 1fr; }
@media (min-width: 46rem) { .idx { grid-template-columns: 1fr 1fr; } }
@media (min-width: 68rem) { .idx { grid-template-columns: repeat(3, 1fr); } }
.idx-item { padding-block: 0.9rem; border-top: 1px solid var(--rule2);
            break-inside: avoid; }
.idx-item h4 { font-size: 1.0625rem; font-weight: 600; letter-spacing: -0.01em;
               display: flex; align-items: baseline; gap: 0.5rem; }
.idx-item .star { font-family: var(--mono); font-size: 0.6875rem;
                  color: var(--ink3); }
.idx-item .tag { font-style: italic; color: var(--ink2); font-size: 0.9375rem; }
.idx-item p { font-size: 0.875rem; color: var(--ink2); margin-top: 0.35rem; }
.idx-item a { text-decoration: none; }
@media (hover: hover) { .idx-item a:hover h4 { color: var(--sig-t); } }

/* --- ruled lists (writing, elsewhere, sites) --------------------------- */
.rows { border-top: 1px solid var(--rule); }
.rows a {
  display: flex; align-items: baseline; gap: 0.9rem;
  padding-block: 0.75rem; border-bottom: 1px solid var(--rule2);
  text-decoration: none;
}
.rows .t { font-size: 1.0625rem; }
.rows .lead-rule { flex: 1 1 auto; border-bottom: 1px dotted var(--rule);
                   transform: translateY(-0.28em); min-width: 1.5rem; }
.rows .w { font-family: var(--mono); font-size: 0.6875rem; color: var(--ink3);
           text-align: right; overflow-wrap: anywhere; }
@media (hover: hover) { .rows a:hover .t { color: var(--sig-t); } }
/* Narrow: a long title and its source cannot share a line, and the leader
   between them then wraps into a dotted stub. The source drops under the
   title instead and the leader goes away with it — measured at 390px on the
   《搞到钱再说》row, which is the longest one there is. */
@media (max-width: 34rem) {
  .rows a { flex-wrap: wrap; gap: 0.15rem 0.9rem; }
  .rows .lead-rule { display: none; }
  .rows .w { width: 100%; text-align: left; }
}

/* --- 版权页 · the colophon --------------------------------------------
   A colophon states what the book is made of and who is responsible for it.
   It does NOT state what the build reads its data from, and it does not list
   the hex values of its own inks — that was three cells of documentation
   written for the person who made the page, printed for people who did not
   ask. It is gone.

   What is left is what a reader could act on: how it was made and under what
   licence, where the source is, what it is set in, where it lives, and the
   way back up. Five facts on three lines.

   The typeface line stays because a colophon naming its typeface is the
   oldest thing in this whole design; "loads no web font" does not, because
   that is a boast about the build, not a fact about the book. */
.colophon { border-top: 4px solid var(--ink); padding-block: 2rem 4rem;
            margin-top: clamp(2rem, 5vw, 3.5rem); }
.colophon p { font-family: var(--mono); font-size: 0.75rem; line-height: 2;
              color: var(--ink2); }
.colophon p + p { margin-top: 0.15rem; }
.colophon a { color: var(--ink2); text-decoration: underline;
              text-underline-offset: 3px; text-decoration-thickness: 1px; }
.colophon a:hover { color: var(--ink); }
.imprint { display: flex; flex-wrap: wrap; gap: 0.4rem 1.5rem;
           margin-top: 1.4rem; padding-top: 0.9rem;
           border-top: 1px solid var(--rule2); }
.imprint a { text-decoration: none; border-bottom: 1px solid var(--rule); }

/* the printer's mark: two inks, drawn, no file to fetch */
.mark { width: 34px; height: 34px; position: relative; margin-bottom: 0.8rem; }
.mark::before, .mark::after { content: ""; position: absolute; inset: 0; }
.mark::before { border: 2px solid var(--ink); border-radius: 50%; }
.mark::after { inset: 9px; background: var(--sig); border-radius: 50%; }


/* --- motion -------------------------------------------------------------
   A printed sheet does not fidget. Four things move on this page and nothing
   else does:

     1. the nameplate settles once, on load
     2. the terracotta rule draws from the left, once
     3. each section rises a few pixels the first time it is reached
     4. a product plate leans forward a hair under the pointer

   All four are opacity and transform only — no layout property is animated,
   so none of them can cost a reflow. Durations are 500–900ms on a decelerating
   curve: slow enough to read as paper settling, not as a UI acknowledging you.

   EVERY hidden state is behind `.motion`, which script adds to <html>. With no
   script, or with the script broken, nothing is ever hidden — a design whose
   text only appears if an observer fires is a design that ships blank pages.

   `prefers-reduced-motion` removes the class entirely rather than shortening
   the durations: a reader who asked for no motion gets a page that was never
   going to move, not a fast version of the moving one. */
@media (prefers-reduced-motion: no-preference) {
  .motion .rise { opacity: 0; transform: translateY(9px);
                  transition: opacity 620ms cubic-bezier(.16,1,.3,1),
                              transform 620ms cubic-bezier(.16,1,.3,1); }
  .motion .rise.seen { opacity: 1; transform: none; }

  .motion .mast-name, .motion .mast-cn, .motion .mast-kick, .motion .dateline {
    animation: settle 760ms cubic-bezier(.16,1,.3,1) both;
  }
  .motion .mast-cn   { animation-delay: 70ms; }
  .motion .dateline  { animation-delay: 140ms; }
  .motion .mast-rule { transform-origin: left center; animation: draw 900ms cubic-bezier(.16,1,.3,1) both; }
  @keyframes settle { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
  @keyframes draw   { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  /* The one hover on the page that moves anything. A printed plate cannot
     lift, so it does not lift: it scales by 1.5% inside its own frame, which
     reads as the picture coming forward rather than the card leaving the
     paper. */
  @media (hover: hover) and (pointer: fine) {
    .fig img, .fig video { transition: transform 520ms cubic-bezier(.16,1,.3,1); }
    a.fig:hover img, a.fig:hover video { transform: scale(1.015); }
  }
}
/* Colour is allowed to move everywhere, always: it costs nothing and it is
   what tells a pointer that a row is a link. */
.toc a .t, .rows a .t, .idx-item h4, .spec dd a, .runner .back, .press-switch,
.colophon a, .imprint a {
  transition: color 180ms ease, border-color 180ms ease;
}
.spec dd a { text-decoration: none; border-bottom: 1px solid var(--rule); }
.spec dd a:hover { color: var(--sig-t); border-bottom-color: currentColor; }

/* The quarter-em where the two scripts meet. `text-autospace` still does
   nothing in this browser, so the gap is a margin on the Latin run, applied
   by the pass at the foot of the page. A margin and not an inserted
   character, because an inserted character is one the reader copies out. */
.lat { margin-inline: 0.12em; }
</style>
</head>

<script>
/* The whole edition, set from the same files the live site reads. */
(function () {
  /* --- strings ----------------------------------------------------------

     script: there is no default markup for a language pass to harvest, so the
     default has to be written down.

     The prose keys — the standfirst, the department notes, the colophon — are
     the live site's own, harvested from its markup, and i18n.js holds the
     human translations of them. This edition writes no prose of its own.

     ⚠️ `standfirst` CONTAINS MARKUP (`<strong>`) and is injected as HTML. The
     first attempt harvested it with `(.*?)</`, which stopped at the opening
     of `</strong>` and left the tag unclosed — the browser then carried that
     <strong> into every element after it, every CSS grid on the page saw one
     child instead of three, and the page grew 1.2 screens taller. Harvested by
     matching the closing tag now, and asserted balanced. */
  var BASE = {
    'alias': '在悉尼和稀泥',
    'byline': 'AI 创业中 · 咨询 · 独立开发，同时进行',
    'colophon': '用 Claude Code 构建 · MIT / CC BY-NC',
    'colophon.source': '本页源码',
    'data.lang': 'zh',

    'dept.links.title': '找到我',

    'dept.writing.note': '两年前写的一本 PDF，讲的是先把钱赚到手再谈别的；还有一套把内容生产自动化的工作流。',
    'dept.writing.title': '《搞到钱再说》与其他',
    'doc.title': 'James AI · 在悉尼和稀泥',
    'html.lang': 'zh-Hans',
    'lang.system': '跟随系统',
    'link.github': '开源仓库',
    'link.kofi': '请我喝杯咖啡',
    'link.red': '在悉尼和稀泥',
    'link.red.where': '小红书 / RED',
    'link.telegram': 'James FYI · 关于我（含微信）',
    'link.vt': 'Vibe Thursday · 悉尼每周四上午的 AI 局',
    'link.vt.where': '线下 · 免费 · vibethursday.com',
    'link.x': '在悉尼和稀泥',

    'prod.book.where': 'PDF · 购买',

    'site.inkstone': 'Markdown 笔记 · inkslab.app',
    'standfirst': '全栈工程师，现居悉尼。开过店，卖过房，创过业。我做<strong>能自己跑起来的工具</strong>： 四个原生 macOS 应用，和一批让 Claude Code 真正去做事的技能，发文章、做设计、 拆待办、跑一门小生意，而不是停在讨论怎么做。源码公开。',
    'p.apps': '四个 macOS 应用',
    'p.backTop': '回到页首 ↑',
    'p.city': '悉尼',
    'p.contents': '本期目录',
    'p.count': '%s 项',
    'p.date': '%s 年 %s 月 %s 日',
    'p.auto': '自动',
    'p.day': '日间版',
    'p.feature': '特稿',
    'p.issue': '第 %s 号',
    'p.issue0': '创刊',
    'p.lead': '卷首',
    'p.mode': '显示模式',
    'p.night': '夜间版',
    'p.other': '另一版设计 →',
    'p.press': '一人公司',
    'p.setIn': '正文 Iowan Old Style 与宋体',
    'p.skills': '%s 项技能与系统',
    'p.skip': '跳到正文',
    'p.spec.kind': '类型',
    'p.spec.repo': '源码',
    'p.spec.site': '官网',
    'p.spec.stars': '星标',
    'p.systems': '系统与技能',
    'p.toTop': '目录 ↑',
  };
  document.documentElement.classList.add('motion');

  var TABLE = (typeof STRINGS !== 'undefined') ? STRINGS : {};
  var dict = BASE, dataLang = 'zh';

  function T(k) {
    var v = (dict[k] !== undefined) ? dict[k] : BASE[k];
    if (v === undefined) return '';
    for (var i = 1; i < arguments.length; i++) v = v.replace('%s', arguments[i]);
    return v;
  }
  function t(v) { return v && typeof v === 'object' ? (v[dataLang] || v.en || v.zh) : (v || ''); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  /* One token for every generated asset. Without it the browser keeps serving
     the file it cached under the same name after a re-shoot. */
  var V = '?v=16';
  var CN = ['', 'I', 'II', 'III', 'IV', 'V', 'VI'];
  function pn(n) { return ('0' + n).slice(-2); }

  var issue = (typeof ISSUES !== 'undefined' && ISSUES.length) ? ISSUES[ISSUES.length - 1] : null;
  var apps = CATEGORIES.filter(function (c) { return c.featured; })[0];
  var rest = CATEGORIES.filter(function (c) { return !c.featured; });
  var restCount = rest.reduce(function (n, c) { return n + c.items.length; }, 0);
  var d = issue && issue.date ? issue.date.split('-') : null;

  /* --- picture ----------------------------------------------------------
     Returns the ELEMENT ONLY. The callers put it in different frames, and a
     helper that also chose the frame would have to be told which one. */
  function fig(it) {
    if (!it.shot) return '';
    var base = it.shot.replace(/\.(jpg|webp)$/, '');
    var poster = '' + base + '.webp' + V;
    if (!it.motion) {
      return '<img src="' + poster + '" alt="" width="1024" height="640"'
           + ' loading="lazy" decoding="async">';
    }
    return '<video class="motion" poster="' + poster + '" muted loop playsinline'
      + ' preload="none" aria-hidden="true" tabindex="-1" width="1024" height="640">'
      + '<source data-src="' + base + '.webm' + V + '" type="video/webm">'
      + '<source data-src="' + base + '.mp4' + V + '" type="video/mp4">'
      + '</video>';
  }
  function url(it) { return it.site || ('https://github.com/iamzifei/' + it.repo); }
  function page(it) {
    return (it.shots && it.shots.length)
      ? 'product.html?p=' + encodeURIComponent(it.repo) : url(it);
  }
  function host(u) { return u.replace(/^https?:\/\//, '').replace(/\/$/, ''); }

  /* The two rows that name a place are LINKS to that place. They were set as
     plain text, which is the sort of thing that reads fine and fails the
     moment somebody tries to click "inkslab.app" — and they will, because it
     is a URL. Safe to wrap: nothing in a spec block has an anchor ancestor
     (checked in the DOM, not assumed). */
  function spec(it, kind) {
    var rows = [[T('p.spec.kind'), kind, null],
                [T('p.spec.stars'), it.stars ? it.stars + ' ★' : '—', null]];
    if (it.repo) rows.push([T('p.spec.repo'), 'iamzifei/' + it.repo,
                            'https://github.com/iamzifei/' + it.repo]);
    if (it.site) rows.push([T('p.spec.site'), host(it.site), it.site]);
    return '<dl class="spec">' + rows.map(function (r) {
      var v = esc(r[1]);
      if (r[2]) v = '<a href="' + esc(r[2]) + '" rel="noopener">' + v + '</a>';
      return '<div><dt>' + esc(r[0]) + '</dt><dd>' + v + '</dd></div>';
    }).join('') + '</dl>';
  }
  function rows(list) {
    return '<div class="rows">' + list.map(function (it) {
      return '<a href="' + it.url + '"><span class="t">' + esc(t(it.name)) + '</span>'
           + '<span class="lead-rule"></span>'
           + '<span class="w">' + esc(t(it.where)) + '</span></a>';
    }).join('') + '</div>';
  }

  /* --- the edition ------------------------------------------------------ */
  function render() {
    document.documentElement.lang = T('html.lang');
    document.title = T('doc.title');
    dataLang = T('data.lang') || 'en';

    document.getElementById('skip').textContent = T('p.skip');
    document.getElementById('mastAlias').textContent = T('alias');
    document.getElementById('mastPress').textContent = T('p.press');
    document.getElementById('mastCity').textContent = T('p.city');
    document.getElementById('mastIssue').textContent =
      (issue ? T('p.issue', pn(issue.no)) : T('p.issue0'))
      + (issue && issue.title ? ' · ' + issue.title : '');

    document.getElementById('dateline').innerHTML = [
      '<span class="no">' + (issue ? T('p.issue', pn(issue.no)) : T('p.issue0')) + '</span>',
      d ? '<span>' + T('p.date', d[0], +d[1], +d[2]) + '</span>' : '',
      '<span>SZX → SYD</span>',
      '<span>' + T('p.apps') + '</span>',
      '<span>' + T('p.skills', restCount) + '</span>'
    ].filter(Boolean).join('');

    var SECTIONS = [
      { id: 'tools',     t: T('dept.work.title'),    n: apps ? T('p.count', apps.items.length) : '' },
      { id: 'index',     t: T('p.systems'),          n: T('p.count', restCount) },
      { id: 'writing',   t: T('dept.writing.title'), n: T('p.count', WRITING.items.length) },
      { id: 'elsewhere', t: T('dept.links.title'),   n: T('p.count', ELSEWHERE.items.length + SITES.items.length) }
    ];

    var out = [];

    out.push('<nav class="toc rise" id="contents" aria-label="' + esc(T('p.contents')) + '">'
      + '<p class="label" style="padding-bottom:.7rem;border-bottom:1px solid var(--ink)">'
      + esc(T('p.contents')) + '</p><div class="toc-grid">'
      + SECTIONS.map(function (s, i) {
          return '<a href="#' + s.id + '"><span class="folio">' + pn(i + 1) + '</span>'
               + '<span class="t">' + esc(s.t) + '</span>'
               + '<span class="lead-rule"></span>'
               + '<span class="n">' + esc(s.n) + '</span></a>';
        }).join('') + '</div></nav>');

    /* 卷首. The paragraph is the live site's standfirst — the one a person has
       already translated into seven languages. This edition used to write its
       own here, including a line about being the second design: a note to the
       author, printed for the reader. */
    out.push('<section class="lead rise" id="lead">'
      + '<div class="lead-body"><p>' + T('standfirst') + '</p></div>'
      + '<p class="lead-by label">' + esc(T('byline')) + '</p>'
      + '<figure class="plate">'
      +   '<img src="assets/mag-opener.webp' + V + '" alt="" width="1600" height="1075"'
      +   ' data-day="assets/mag-opener.webp' + V + '"'
      +   ' data-night="assets/mag-opener-night.webp' + V + '"'
      +   ' loading="lazy" decoding="async">'
      + '</figure></section>');

    if (apps) {
      var kind = t(apps.title), items = apps.items;
      var body = ['<section class="sec rise" id="tools">'
        + '<div class="sec-head"><span class="sec-no">' + CN[1] + '</span>'
        + '<h2 class="sec-t">' + esc(T('dept.work.title')) + '</h2>'
        + '<p class="sec-note">' + esc(T('dept.work.note')) + '</p></div>'];

      var f = items[0];
      body.push('<article class="feature">'
        + '<p class="runhead label"><span>' + esc(kind) + ' · ' + esc(T('p.feature'))
        +   '</span><span>' + pn(1) + '</span></p>'
        + '<h3>' + esc(t(f.name)) + '</h3>'
        + '<p class="standfirst">' + esc(t(f.tagline)) + '</p>'
        + '<a class="fig" href="' + page(f) + '" aria-label="' + esc(t(f.name)) + '">' + fig(f) + '</a>'
        + '<div class="body"><p>' + esc(t(f.desc)) + '</p></div>'
        + spec(f, kind) + '</article>');

      items.slice(1).forEach(function (it, i) {
        body.push('<article class="entry">'
          + '<a class="e-fig fig" href="' + page(it) + '" aria-label="' + esc(t(it.name)) + '">'
          +   fig(it) + '</a>'
          + '<div class="e-txt">'
          +   '<p class="runhead label">' + esc(kind) + ' · ' + pn(i + 2) + '</p>'
          +   '<h3><a href="' + page(it) + '" style="text-decoration:none">' + esc(t(it.name)) + '</a></h3>'
          +   '<p class="standfirst">' + esc(t(it.tagline)) + '</p>'
          +   '<p class="desc">' + esc(t(it.desc)) + '</p>'
          +   spec(it, kind)
          + '</div></article>');
      });
      out.push(body.join('') + '</section>');
    }

    /* The classifieds — name, one line, one paragraph, twelve of them in three
       columns. The paragraphs were cut once to buy back half a screen and put
       straight back: they are 425 characters of the 1500 this edition carries,
       and trading content for a screen count is optimising the wrong number.
       The half screen came from cropping the two plates to bands instead. */
    out.push('<section class="sec rise" id="index">'
      + '<div class="sec-head"><span class="sec-no">' + CN[2] + '</span>'
      + '<h2 class="sec-t">' + esc(T('p.systems')) + '</h2></div>'
      + rest.map(function (c) {
          return '<p class="label idx-head">' + esc(t(c.title)) + ' · '
               + esc(T('p.count', c.items.length)) + '</p>'
               + '<div class="idx">' + c.items.map(function (it) {
                   return '<div class="idx-item"><a href="' + url(it) + '">'
                        + '<h4>' + esc(t(it.name))
                        + (it.stars ? '<span class="star">★ ' + it.stars + '</span>' : '')
                        + '</h4>'
                        + '<p class="tag">' + esc(t(it.tagline)) + '</p>'
                        + '<p>' + esc(t(it.desc)) + '</p></a></div>';
                 }).join('') + '</div>';
        }).join('') + '</section>');

    out.push('<section class="sec rise" id="writing">'
      + '<div class="sec-head"><span class="sec-no">' + CN[3] + '</span>'
      + '<h2 class="sec-t">' + esc(T('dept.writing.title')) + '</h2>'
      + '<p class="sec-note">' + esc(T('dept.writing.note')) + '</p></div>'
      + rows(WRITING.items) + '</section>');

    out.push('<section class="sec rise" id="elsewhere">'
      + '<div class="sec-head"><span class="sec-no">' + CN[4] + '</span>'
      + '<h2 class="sec-t">' + esc(T('dept.links.title')) + '</h2>'
      + '<p class="sec-note">' + esc(T('dept.links.note')) + '</p></div>'
      + rows(ELSEWHERE.items)
      + '<p class="label idx-head">' + esc(T('dept.sites.title')) + ' · '
      + esc(T('dept.sites.note')) + '</p>'
      + rows(SITES.items)
      + '<figure class="plate">'
      +   '<img src="assets/mag-back.webp' + V + '" alt="" width="1600" height="1164"'
      +   ' data-day="assets/mag-back.webp' + V + '"'
      +   ' data-night="assets/mag-back-night.webp' + V + '"'
      +   ' loading="lazy" decoding="async">'
      + '</figure></section>');

    document.getElementById('paper').innerHTML = out.join('');

    document.getElementById('colophon').innerHTML =
        '<p>' + esc(T('colophon')) + ' · ' + esc(T('colophon.source'))
      + ' <a href="https://github.com/iamzifei/home">iamzifei/home</a></p>'
      + '<p>' + esc(T('p.setIn')) + '</p>';
    document.getElementById('imprint').innerHTML =
        '<span>jamesai.dev</span>'
      + '<span>' + esc(T('p.city')) + ' · ' + (d ? d[0] : new Date().getFullYear()) + '</span>'
      + '<a href="#top">' + esc(T('p.backTop')) + '</a>';

    /* Only the FIRST option is translated. The rest are language names and
       they stay in their own language — somebody looking for 繁體中文 is
       looking for 繁體中文, not for "Traditional Chinese". */
    langSels.forEach(function (sl) { sl.options[0].textContent = T('lang.system'); });
    if (typeof window.__pressApply === 'function') __pressApply(__pressSaved());
    modeLabel();
    spaceCJK(document.getElementById('paper'));
    spaceCJK(document.querySelector('.colophon'));
    spaceCJK(document.querySelector('.mast'));
    wireRunner();
    wireReveal();
    armDemos();
  }

  /* --- language ----------------------------------------------------------
     The same resolution the live site uses, so the two agree about what a
     browser asking for `zh-HK` should be given. */
  function resolveLang(choice) {
    if (choice !== 'system') return choice;
    var wanted = navigator.languages || [navigator.language || 'zh'];
    /* Three languages. There were eight until 2026-09-02; the other five were
       interface labels no speaker had read, sitting over product copy that was
       in English regardless. A browser asking for one of them now gets English
       if it will take English, and the site default otherwise. */
    for (var i = 0; i < wanted.length; i++) {
      var tag = String(wanted[i]).toLowerCase();
      if (tag.indexOf('zh') === 0) return /hant|tw|hk|mo/.test(tag) ? 'zh-Hant' : 'zh-Hans';
      if (tag.indexOf('en') === 0) return 'en';
    }
    return 'zh-Hans';
  }
  function applyLang(choice) {
    var lang = resolveLang(choice);
    dict = (lang === 'zh-Hans') ? BASE : (TABLE[lang] || BASE);
    render();
  }

  /* THE CONTROLS EXIST TWICE — once in the dateline, once in the running head
     — and that is deliberate. One copy sat at the very top of an eight-screen
     page: correct as typography, useless as a control, because for seven of
     those screens there was no way to reach it. They are not two controls;
     they are one setting with two handles, wired here from one list so they
     cannot disagree. */
  var langSels = [].slice.call(document.querySelectorAll('.js-lang'));
  var modeBtns = [].slice.call(document.querySelectorAll('.js-mode'));
  var langSel = langSels[0];
  var MODE_NEXT = { system: 'day', day: 'night', night: 'system' };
  function modeLabel() {
    if (typeof __pressSaved !== 'function') return;
    var v = __pressSaved();
    var name = v === 'day' ? T('p.day') : v === 'night' ? T('p.night') : T('p.auto');
    modeBtns.forEach(function (b) {
      var l = b.querySelector('.js-mode-label');
      if (l) l.textContent = name;
      b.setAttribute('aria-label', T('p.mode') + ' · ' + name);
    });
  }
  modeBtns.forEach(function (b) {
    b.addEventListener('click', function () {
      var v = MODE_NEXT[__pressSaved()] || 'system';
      try { localStorage.setItem('jamesai.press', v); } catch (e) {}
      __pressApply(v);
      modeLabel();
    });
  });

  var langChoice = 'system';
  try { langChoice = localStorage.getItem('press.lang') || 'system'; } catch (e) {}
  langSels.forEach(function (sl) {
    sl.value = langChoice;
    sl.addEventListener('change', function () {
      langChoice = sl.value;
      langSels.forEach(function (o) { o.value = langChoice; });
      try { localStorage.setItem('press.lang', langChoice); } catch (e) {}
      applyLang(langChoice);
    });
  });

  /* --- CJK / Latin spacing ------------------------------------------------
     `text-autospace` measurably does nothing in this browser, so the
     quarter-em the standard asks for where the two scripts meet is applied as
     a margin on the Latin run. A wrapper and not an inserted space, because an
     inserted space is a character the reader copies out with the text.

     Re-run after every render, and it costs nothing in a language that has no
     CJK in it: the walker rejects every node on the first test. */
  function spaceCJK(root) {
    if (!root) return;
    var CJK = /[㐀-鿿぀-ヿ＀-￯]/;
    var RUN = /([A-Za-z0-9][A-Za-z0-9@._+\-\/:#]*)/g;
    var SKIP = { CODE: 1, PRE: 1, SCRIPT: 1, STYLE: 1, TIME: 1 };
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: function (n) {
        if (!n.nodeValue || !CJK.test(n.nodeValue)) return NodeFilter.FILTER_REJECT;
        var p = n.parentElement;
        while (p && p !== root) {
          if (SKIP[p.tagName] || p.classList.contains('lat')) return NodeFilter.FILTER_REJECT;
          if (getComputedStyle(p).fontFamily.indexOf('mono') > -1) return NodeFilter.FILTER_REJECT;
          p = p.parentElement;
        }
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    var nodes = [], n;
    while ((n = walker.nextNode())) nodes.push(n);
    nodes.forEach(function (node) {
      var s = node.nodeValue, frag = document.createDocumentFragment(), last = 0, m;
      RUN.lastIndex = 0;
      while ((m = RUN.exec(s))) {
        var before = s[m.index - 1], after = s[m.index + m[0].length];
        if (!(before && CJK.test(before)) && !(after && CJK.test(after))) continue;
        if (m.index > last) frag.appendChild(document.createTextNode(s.slice(last, m.index)));
        var span = document.createElement('span');
        span.className = 'lat';
        span.textContent = m[0];
        frag.appendChild(span);
        last = m.index + m[0].length;
      }
      if (!last) return;
      if (last < s.length) frag.appendChild(document.createTextNode(s.slice(last)));
      node.parentNode.replaceChild(frag, node);
    });
  }

  /* --- the reveal --------------------------------------------------------
     Once per element, then the observer lets it go: a section that fades every
     time it is scrolled past is a section arguing with the reader. Re-armed on
     every render, because the language switch replaces all of it. */
  var revealIO = null;
  function wireReveal() {
    var els = [].slice.call(document.querySelectorAll('.rise'));
    if (!els.length) return;
    var reduced = false;
    try { reduced = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    if (reduced || !('IntersectionObserver' in window)) {
      els.forEach(function (el) { el.classList.add('seen'); });
      return;
    }
    if (revealIO) revealIO.disconnect();
    revealIO = new IntersectionObserver(function (entries, obs) {
      entries.forEach(function (e) {
        if (!e.isIntersecting) return;
        e.target.classList.add('seen');
        obs.unobserve(e.target);
      });
    }, { rootMargin: '0px 0px -8% 0px' });
    els.forEach(function (el) { revealIO.observe(el); });
  }

  /* --- the running head --------------------------------------------------
     Which section the reader is in, taken from the sections' own offsets
     rather than from IntersectionObserver rootMargins: "the last section whose
     top has passed the strip" is a sentence you can check against a scroll
     position, and it needs no re-tuning when a section changes height.

     Rebuilt on every render: the section names change with the language and
     the offsets change with them. */
  var runnerScroll = null;
  function wireRunner() {
    var runner = document.getElementById('runner');
    var here = document.getElementById('runnerHere');
    if (!runner || !here) return;
    var back = runner.querySelector('.back');
    if (back) back.textContent = T('p.toTop');
    runner.querySelector('.brand').textContent = T('alias');

    var marks = [{ el: document.getElementById('lead'), f: '', t: T('p.lead') }];
    [['tools', T('dept.work.title')], ['index', T('p.systems')],
     ['writing', T('dept.writing.title')],
     ['elsewhere', T('dept.links.title')]].forEach(function (pair, i) {
      var el = document.getElementById(pair[0]);
      if (el) marks.push({ el: el, f: CN[i + 1], t: pair[1] });
    });

    var pending = false, last = -1, shown = false;
    function measure() {
      pending = false;
      var y = window.scrollY || window.pageYOffset;
      var on = y > (document.querySelector('.mast').offsetHeight - 40);
      if (on !== shown) { shown = on; runner.classList.toggle('on', on); }
      var at = 0;
      for (var i = 0; i < marks.length; i++) if (marks[i].el.offsetTop - 64 <= y) at = i;
      if (at !== last) {
        last = at;
        here.innerHTML = (marks[at].f ? '<span class="f">' + marks[at].f + '</span>' : '')
                       + esc(marks[at].t);
      }
    }
    function onScroll() {
      if (pending) return;
      pending = true;
      requestAnimationFrame(measure);
    }
    if (runnerScroll) {
      window.removeEventListener('scroll', runnerScroll);
      window.removeEventListener('resize', runnerScroll);
    }
    runnerScroll = onScroll;
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll, { passive: true });
    measure();
  }

  /* --- the demos: loaded late, played only while visible -------------------
     Nothing is fetched until a frame is near the viewport, off screen is
     paused rather than merely off screen, and `prefers-reduced-motion` means
     never armed — the poster is frame 0 of the film, so nothing is missing.

     A function and not a one-shot, because every render replaces the very
     elements the observer was watching. */
  var io = null;
  function armDemos() {
    var vids = [].slice.call(document.querySelectorAll('video.motion'));
    if (!vids.length) return;
    try { if (matchMedia('(prefers-reduced-motion: reduce)').matches) return; } catch (e) {}
    if (!('IntersectionObserver' in window)) return;
    if (io) io.disconnect();
    function play(v) { var p = v.play(); if (p && p.catch) p.catch(function () {}); }
    io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        var v = e.target;
        v.dataset.vis = e.isIntersecting ? '1' : '';
        if (!e.isIntersecting) { v.pause(); return; }
        if (!v.dataset.armed) {
          v.dataset.armed = '1';
          [].forEach.call(v.querySelectorAll('source'), function (s) {
            s.src = s.getAttribute('data-src');
          });
          v.muted = true;
          var wait = vids.indexOf(v) * 1700;
          v.addEventListener('loadeddata', function () {
            setTimeout(function () { if (v.dataset.vis) play(v); }, wait);
          }, { once: true });
          v.load();
          return;
        }
        play(v);
      });
    }, { rootMargin: '200px 0px' });
    vids.forEach(function (v) { io.observe(v); });
  }

  applyLang(langChoice);

  /* Live star counts: one request for the whole account, after paint, and the
     numbers in data.js stand if it fails or the reader is offline.
     This came across from the previous homepage. Without it the counts are
     whatever was last hand-written into data.js — on 2026-09-02 that was
     0 stars for three public repos that actually had 4, 1 and 2. */
  fetch('https://api.github.com/users/iamzifei/repos?per_page=100&sort=updated')
    .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
    .then(function (repos) {
      var live = {};
      repos.forEach(function (r) { live[r.name.toLowerCase()] = r.stargazers_count; });
      var changed = false;
      CATEGORIES.forEach(function (c) {
        c.items.forEach(function (i) {
          var n = live[String(i.repo || '').toLowerCase()];
          if (typeof n === 'number' && n !== i.stars) { i.stars = n; changed = true; }
        });
      });
      /* render() re-arms the demo videos at its end; re-rendering without it
         would leave four <video> elements observed by a dead observer. */
      if (changed) render();
    })
    .catch(function () {});
})();
</script>
