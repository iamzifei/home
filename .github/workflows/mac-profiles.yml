# jamesai.dev/mac — community profiles.
#
# Pull requests touching mac/u/: validate each added/changed profile with the
# validator from the BASE branch (so a PR cannot edit the check it is judged
# by), fail if the PR touches anything outside mac/u/*.json, and fail if it
# deletes someone else's profile. A human still reviews and merges.
#
# Pushes to main touching mac/u/: rebuild mac/index.json and commit it back.
name: mac-profiles

on:
  pull_request:
    paths: ["mac/u/**"]
  push:
    branches: [main]
    paths: ["mac/u/**"]

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git show "$BASE:scripts/validate-mac-profile.py" > /tmp/validate.py
          # NUL-separated names: spaces or non-ASCII in a filename cannot split or hide it.
          outside=$(git diff -z --name-only "$BASE" HEAD | tr '\0' '\n' | grep -v -E '^mac/u/[^/]+\.json$' || true)
          if [ -n "$outside" ]; then echo "PR touches files outside mac/u/*.json:"; echo "$outside"; exit 1; fi
          git diff -z --name-only --diff-filter=D "$BASE" HEAD -- mac/u/ | xargs -0 -r python3 /tmp/validate.py --deleted
          git diff -z --name-only --diff-filter=ACMR "$BASE" HEAD -- mac/u/ | xargs -0 -r python3 /tmp/validate.py

  index:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: mac-index
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild hub index and commit if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Pull first so two quick merges don't race to a non-fast-forward push.
          git pull --rebase origin main
          python3 scripts/build-mac-index.py
          git diff --quiet mac/index.json && exit 0
          git add mac/index.json
          git commit -m "mac: rebuild index"
          git push origin HEAD:main
