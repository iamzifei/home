  var d = v === 'night';
  if (v === 'system') { try { d = matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) {} }
  document.documentElement.setAttribute('data-press', d ? 'night' : 'day');

<link rel="stylesheet" href="mac.css?v=2">
</head>
<body>
<div class="wrap">
  <div class="bar">
    <nav><a href="/">← jamesai.dev</a></nav>
    <div id="bar-tools"></div>
  </div>
  <header class="hero">
    <span class="live"><i></i><span id="live"></span></span>
    <h1 id="title"></h1>
    <p class="sub" id="sub"></p>
    <div class="stats" id="stats"></div>
  </header>

  <section class="note join">
    <h2 id="join-title"></h2>
    <p id="join-sub"></p>
    <div class="cmd"><code id="cmd">curl -fsSL https://jamesai.dev/mac/scan.py | python3</code><button type="button" id="copy"></button></div>
    <ol id="join-steps"></ol>
    <p id="join-note" style="font-size:13px;color:var(--ink3)"></p>
  </section>

  <div class="tabs" role="tablist" id="tabs"></div>
</div>

<div class="filters" id="filters">
  <div class="wrap"><div class="row" id="f-cat"></div></div>
</div>

<main class="wrap" id="main"></main>

<div class="wrap"><footer><span id="foot"></span><span><a href="/">jamesai.dev</a> · <a href="https://x.com/JamesAI">@JamesAI</a></span></footer></div>

<script src="common.js?v=2"></script>
<script>
/* ---------------------------------------------------------------------------
   The hub. index.json is generated from every mac/u/<handle>.json by
   scripts/build-mac-index.py (run by a GitHub Action on each merge):
     people  one summary row per person
     apps    ranked by how many people use it, then total launches
     skills  same, for Claude Code skills
   catalog.json supplies names, icons, links and prices.
   --------------------------------------------------------------------------- */
(function () {
  var K = window.MacKit, IDX = null, CAT = null;
  var state = { tab: 'apps', cat: 'all' };
  try { var h = location.hash.slice(1); if (['apps', 'skills', 'people'].indexOf(h) >= 0) state.tab = h; } catch (e) {}

  function app(id, fallbackName) {
    var c = K.own(CAT.apps, id) || {};
    return { id: id, name: c.name || fallbackName || id, icon: c.icon, cat: c.cat || 'other', url: c.ref || c.url, ref: !!c.ref, price: c.price, desc: c.desc };
  }
  function icon(a, cls) {
    return a.icon ? '<img class="' + cls + '" src="icons/' + a.icon + '.png" alt="" loading="lazy">'
      : '<span class="' + cls + ' tile">' + K.esc((K.t(a.name) || '?').trim().charAt(0).toUpperCase()) + '</span>';
  }

  function paintTabs() {
    var s = K.S();
    document.getElementById('tabs').innerHTML = [['apps', s.tabApps], ['skills', s.tabSkills], ['people', s.tabPeople]].map(function (t) {
      return '<button class="tab" role="tab" type="button" data-tab="' + t[0] + '" aria-selected="' + (state.tab === t[0]) + '">' + t[1] + '</button>';
    }).join('');
    var showCats = state.tab === 'apps';
    document.getElementById('filters').hidden = !showCats;
    if (showCats) {
      var counts = {};
      IDX.apps.forEach(function (r) { var c = app(r.id).cat; counts[c] = (counts[c] || 0) + 1; });
      document.getElementById('f-cat').innerHTML = '<span class="lab">' + s.catLab + '</span>'
        + [['all', s.all, IDX.apps.length]].concat(Object.keys(s.cats).filter(function (k) { return counts[k]; }).map(function (k) { return [k, s.cats[k], counts[k]]; }))
          .map(function (o) {
            return '<button class="chip" type="button" data-cat="' + o[0] + '" aria-pressed="' + (state.cat === o[0]) + '">' + K.esc(o[1]) + '<small>' + o[2] + '</small></button>';
          }).join('');
    }
  }

  function paintApps() {
    var s = K.S();
    var rows = IDX.apps.map(function (r) { var a = app(r.id, r.name); a.people = r.people; a.uses = r.uses; return a; })
      .filter(function (a) { return state.cat === 'all' || a.cat === state.cat; });
    return '<ol class="rank">' + rows.map(function (a, i) {
      return '<li><span class="n">' + (i + 1) + '</span>' + icon(a, 'ico')
        + '<div><div class="nm">' + K.esc(K.t(a.name)) + '</div><div class="sm">' + K.esc(s.cats[a.cat] || s.cats.other)
        + (a.desc ? ' · ' + K.esc(K.t(a.desc)) : '') + '</div></div>'
        + '<div class="rt"><b>' + K.f(s.people, a.people) + '</b>' + K.f(s.totalOpens, K.num(a.uses))
        + (a.price ? ' · ' + K.esc(K.t(a.price)) : '')
        + (a.url ? ' · <a class="out" href="' + K.esc(a.url) + '" target="_blank" rel="' + (a.ref ? 'sponsored ' : '') + 'noopener">' + s.site + ' ↗</a>' : '') + '</div></li>';
    }).join('') + '</ol>';
  }

  function paintSkills() {
    var s = K.S();
    return '<ol class="rank">' + IDX.skills.map(function (r, i) {
      return '<li><span class="n">' + (i + 1) + '</span><span class="ico tile">' + K.esc(r.name.replace(/^.*:/, '').charAt(0).toUpperCase()) + '</span>'
        + '<div><div class="nm" style="font-family:var(--mono);font-size:14px">' + (r.url ? '<a href="' + K.esc(r.url) + '" target="_blank" rel="noopener">' + K.esc(r.name) + ' ↗</a>' : K.esc(r.name)) + '</div></div>'
        + '<div class="rt"><b>' + K.f(s.people, r.people) + '</b>' + K.f(s.skillUses, K.num(r.uses)) + '</div></li>';
    }).join('') + '</ol>';
  }

  function paintPeople() {
    var s = K.S();
    return '<div class="people">' + IDX.people.map(function (p) {
      return '<a class="person" href="u/?h=' + encodeURIComponent(p.handle) + '">'
        + '<div class="hd">' + (p.github ? '<img src="https://github.com/' + K.esc(p.github) + '.png?size=88" alt="" width="44" height="44" loading="lazy">' : '<span class="ico tile" style="width:44px;height:44px;border-radius:50%;font-size:18px">' + K.esc((K.t(p.name) || p.handle).charAt(0).toUpperCase()) + '</span>')
        + '<div><div class="name">' + K.esc(K.t(p.name) || p.handle) + '</div><div class="sm" style="font-size:12.5px;color:var(--ink3)">@' + K.esc(p.handle) + '</div></div></div>'
        + (p.bio ? '<p class="desc">' + K.esc(K.t(p.bio)) + '</p>' : '')
        + '<div class="icons">' + p.top.map(function (id) { return icon(app(id), ''); }).join('') + '</div>'
        + '<div class="ft"><span>' + K.f(s.personApps, p.apps) + (p.skills ? ' · ' + K.f(s.personSkills, p.skills) : '') + '</span><span>' + s.seePage + '</span></div>'
        + '</a>';
    }).join('') + '</div>';
  }

  function paintMain() {
    document.getElementById('main').innerHTML = state.tab === 'apps' ? paintApps() : state.tab === 'skills' ? paintSkills() : paintPeople();
  }

  function paintAll() {
    var s = K.S();
    document.title = s.hubTitle + ' · James AI';
    document.getElementById('live').textContent = K.f(s.hubLive, IDX.people.length);
    document.getElementById('title').textContent = s.hubTitle;
    document.getElementById('sub').textContent = s.hubSub;
    var opens = IDX.apps.reduce(function (n, r) { return n + r.uses; }, 0);
    document.getElementById('stats').innerHTML = '<span><b>' + IDX.people.length + '</b>' + s.statPeople + '</span>'
      + '<span><b>' + IDX.apps.length + '</b>' + s.statApps + '</span><span><b>' + K.num(opens) + '</b>' + s.statOpens + '</span>';
    document.getElementById('join-title').textContent = s.joinTitle;
    document.getElementById('join-sub').textContent = s.joinSub;
    document.getElementById('join-steps').innerHTML = s.joinSteps.map(function (x) { return '<li>' + K.esc(x) + '</li>'; }).join('');
    document.getElementById('join-note').textContent = s.joinNote;
    document.getElementById('copy').textContent = s.copy;
    var anyRef = Object.keys(CAT.apps).some(function (k) { return CAT.apps[k].ref; });
    document.getElementById('foot').textContent = (anyRef ? s.affiliate + ' ' : '') + K.f(s.foot, K.date(CAT.checkedAt));
    paintTabs(); paintMain();
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-tab]');
    if (t) { state.tab = t.dataset.tab; try { history.replaceState(null, '', '#' + state.tab); } catch (err) {} paintTabs(); paintMain(); return; }
    var c = e.target.closest('[data-cat]');
    if (c) { state.cat = c.dataset.cat; paintTabs(); paintMain(); }
  });
  document.getElementById('copy').addEventListener('click', function () {
    var btn = this;
    try { navigator.clipboard.writeText(document.getElementById('cmd').textContent); } catch (e) {}
    btn.textContent = K.S().copied; setTimeout(function () { btn.textContent = K.S().copy; }, 1500);
  });

  Promise.all([fetch(K.DATA + '/index.json').then(function (r) { return r.json(); }), fetch('catalog.json').then(function (r) { return r.json(); })])
    .then(function (res) { IDX = res[0]; CAT = res[1]; K.chrome(paintAll); });
})();
</script>
</body>
</html>
